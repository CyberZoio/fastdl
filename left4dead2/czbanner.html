<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MOTD Cyberzoio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        .motd-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="motd-container">
        <img src="czthumb720.jpg" alt="SUPERTANKS Cyberzoio">
    </div>
</body>
</html>
